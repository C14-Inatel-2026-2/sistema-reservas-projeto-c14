services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sistema_reservas
      MYSQL_USER: ${DB_USERNAME:-reservas}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Preencha DB_PASSWORD no arquivo .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Preencha MYSQL_ROOT_PASSWORD no arquivo .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping --host=127.0.0.1 --user=root --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
  app:
    build: .
    mem_limit: 512m
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
      DB_URL: jdbc:mysql://db:3306/sistema_reservas?sslMode=REQUIRED&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-reservas}
      DB_PASSWORD: ${DB_PASSWORD:?Preencha DB_PASSWORD no arquivo .env}
      APP_COMMIT: ${APP_COMMIT:-local}
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  mysql_data:
